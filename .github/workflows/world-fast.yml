# Быстрый мировой обход: четыре части ОДНОВРЕМЕННО.
#
# КУДА ПОЛОЖИТЬ: .github/workflows/world-fast.yml
#
# Отличие от world.yml ровно одно: части не ждут друг друга. Последовательный
# обход занимает ~9 ч, параллельный ~1,5 ч при той же скорости на каждую часть.
# Части идут на РАЗНЫХ раннерах с разными адресами, поэтому нагрузка на адрес
# не растёт — растёт только суммарная на Transfermarkt.
#
# Цена параллельности: части не могут передавать базу друг другу, поэтому все
# стартуют от одного снимка и в конце сливаются (merge.py). Побеждает свежая
# запись; лиги у частей не пересекаются, так что спорных строк почти нет.
#
# world.yml остаётся как медленный и щадящий режим для планового обхода.
name: world-fast

on:
  # Раз в две недели, понедельник 02:00 UTC. Полный мир, а не приоритетные
  # лиги: владельцу нужно, чтобы обновлялись все 126 стран, а не две.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      workers:
        description: "Потоков на КАЖДУЮ часть (16 - вчетверо больше суммарно)"
        default: "16"
      delay:
        description: "Пауза между запросами, мин,макс сек"
        default: "0.4,0.8"
      max_tier:
        description: "До какого дивизиона"
        default: "7"
      youth:
        description: "Брать молодёжные лиги"
        default: "true"

permissions:
  contents: write
  # Заданный блок permissions обнуляет все не перечисленные права: без этой
  # строки gh run download получил бы 403.
  actions: read                 # чтобы скачать артефакт world-sqlite

env:
  WORKERS: ${{ github.event.inputs.workers || '16' }}
  DELAY: ${{ github.event.inputs.delay || '0.4,0.8' }}
  MAX_TIER: ${{ github.event.inputs.max_tier || '7' }}
  YOUTH: ${{ github.event.inputs.youth || 'true' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TM_WEBHOOK_SECRET: ${{ secrets.TM_WEBHOOK_SECRET }}
  WORKER_URL: https://tm-scout-bot.clam83574.workers.dev

jobs:
  # Cron в GitHub не умеет «раз в две недели»: расписание будит нас КАЖДЫЙ
  # понедельник, а эта задача пропускает половину из них.
  #
  # Чётность считаем по неделям от эпохи, а не по номеру ISO-недели: соседние
  # понедельники отличаются ровно на 604800 секунд, поэтому чередование не
  # сбивается никогда. У ISO-недели на годах с 53 неделями чётность
  # повторяется дважды подряд, и раз в несколько лет вышло бы два обхода
  # подряд или пропуск в три недели.
  #
  # Запуск руками проходит всегда - привратник нужен только расписанию.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "запуск вручную - идём"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WEEK=$(( $(date -u +%s) / 604800 ))
          if [ $(( WEEK % 2 )) -eq 0 ]; then
            echo "неделя $WEEK чётная - обходим мир"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "неделя $WEEK нечётная - пропускаем, обход через неделю"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Перепись лиг делается ОДИН раз: иначе четыре части сделали бы её
  # одновременно и вчетверо нагрузили каталог ради одинакового результата.
  prep:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      # ТОЛЬКО restore, не полный actions/cache. Обычный actions/cache в конце
      # задачи САМ сохраняет кэш под своим ключом - и 16.09 эта задача записала
      # под ключом прогона пустышку в полтора килобайта (здесь только .keep,
      # обход идёт дальше). Ключи в GitHub неизменяемы, поэтому задача finish
      # не смогла сохранить под тем же ключом собранный мир и молча этого не
      # сделала. Недельный прогон 21.09 восстановил ту самую пустышку, собрал
      # Германию с Бельгией и полной заменой стёр в боте 134 610 игроков.
      - name: Забрать базу прошлого прогона
        uses: actions/cache/restore@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-
      # База прошлого раза нужна здесь не ради данных - мир собирается целиком
      # при любом старте. Она нужна ради ДИФФА: без неё все игроки выглядят
      # новыми, «пропал агент» не срабатывает ни разу и сводка приходит с
      # пустым списком изменений. Поэтому при пустом кэше берём артефакт
      # прошлого обхода. Не нашли - идём дальше: это потеря истории за один
      # цикл, а не потеря данных (в отличие от crawl.yml, где старт без базы
      # означает стирание мира и прогон обязан упасть).
      - name: Нет базы в кэше - взять из артефакта прошлого обхода
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=0
          if [ -f data/scout.sqlite ]; then
            have=$(python -c "import sqlite3;print(sqlite3.connect('data/scout.sqlite').execute('SELECT COUNT(*) FROM players').fetchone()[0])" 2>/dev/null || echo 0)
          fi
          echo "в базе из кэша игроков: $have"
          if [ "${have:-0}" -lt 50000 ]; then
            echo "::warning::кэш не дал базу ($have), беру артефакт world-sqlite для диффа"
            mkdir -p data
            if gh run download -n world-sqlite -D data; then
              python -c "import sqlite3;print('из артефакта игроков:', sqlite3.connect('data/scout.sqlite').execute('SELECT COUNT(*) FROM players').fetchone()[0])"
            else
              echo "::warning::артефакта тоже нет - обход пройдёт, но сводка будет без изменений: сравнивать не с чем"
            fi
          fi

      - name: Перепись лиг
        run: python discover.py --workers "$WORKERS" --delay "$DELAY"
      - run: mkdir -p data && touch data/.keep
      - uses: actions/upload-artifact@v4
        with: { name: comps, path: competitions.json, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: base-db, path: data, retention-days: 14 }

  crawl:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false        # упавшая часть не должна убивать остальные три
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: comps, path: . }
      - uses: actions/download-artifact@v4
        with: { name: base-db, path: data }
      - name: Часть ${{ matrix.shard }} из 4
        run: |
          YARG=""
          if [ "$YOUTH" = "true" ]; then YARG="--youth"; fi
          python scout.py --world --shard ${{ matrix.shard }}/4 \
            --max-tier "$MAX_TIER" $YARG --workers "$WORKERS" --delay "$DELAY"
      - uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.shard }}
          path: data/scout.sqlite
          retention-days: 14

  finish:
    needs: [gate, crawl]
    # always() здесь ради упавших частей - собираем то, что досчиталось. Но
    # без проверки привратника он бы просыпался и в пропущенную неделю, когда
    # обхода не было вовсе, и слил бы пустоту поверх базы.
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { pattern: db-*, path: parts }
      - uses: actions/download-artifact@v4
        with: { name: comps, path: . }

      - name: Слить части
        run: |
          mkdir -p data
          FILES=$(find parts -name "scout.sqlite" | sort)
          echo "нашёл части:"; echo "$FILES"
          test -n "$FILES" || { echo "::error::ни одна часть не досчиталась"; exit 1; }
          python merge.py data/scout.sqlite $FILES

      - name: Игроки без клуба
        run: python scout.py --free-agents --workers "$WORKERS" --delay "$DELAY"

      - name: Что изменилось
        run: python diff.py --since 15 --out out/world-diff.md

      # Сначала сохранить и доставить, потом учёт - см. lesson 2026-09-16
      - name: Сохранить базу на следующий раз
        uses: actions/cache/save@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with: { name: world-sqlite, path: data/scout.sqlite, retention-days: 30 }

      # ПРЕДОХРАНИТЕЛЬ. Заливка ниже начинается с DROP TABLE: она верна
      # ровно тогда, когда собранная база содержит ВСЁ. Прогон, стартовавший
      # без базы прошлого раза, соберёт только свои лиги и полной заменой
      # сотрёт остальной мир - и останется зелёным. 21.09.2026 так пропали
      # 134 610 игроков, в боте осталось 691. Сравниваем с тем, что уже живёт
      # в боте, и при резкой усушке падаем красным, ничего не тронув.
      - name: Проверить, что база не усохла
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --json             --command "SELECT COUNT(*) players, COUNT(DISTINCT country) countries, COUNT(DISTINCT comp) comps FROM players"             > out/remote.json 2>&1 || true
          python guard.py --remote-json out/remote.json

      - name: Залить в базу бота (Cloudflare D1)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-import.sql -y
          # сводка счётчиков идёт СРАЗУ ЗА данными: иначе экраны
          # выбора показывали бы числа от прошлого прогона
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-stats.sql -y
          npx wrangler@4 d1 execute tm-scout --remote --json \
            --command "SELECT COUNT(*) n FROM players"


      # Уведомление «агент пропал»: главный сигнал продукта. Порог по
      # стоимости обязателен - без него сообщение утонет в игроках низших
      # лиг, где поле меняется от того, что его наконец кто-то заполнил.
      - name: Отобрать события «агент пропал»
        run: python alerts.py --since 15 --min-value 200000 --out out/d1-alerts.sql

      # Сводка идёт ПЕРЕД подробным списком: сначала человек видит, что
      # прогон состоялся и сколько всего изменилось, потом - кого именно
      # звонить. Обратный порядок читается как «пришёл список непонятно из
      # чего». Шлём даже когда изменений нет: молчание неотличимо от
      # сломавшегося прогона, а строка «изменений нет» отличима.
      - name: Краткая сводка в бот
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.TM_WEBHOOK_SECRET != '' }}
        run: |
          python summary.py --since 15 --alerts-min 200000 --out out/summary.txt
          curl -sS -X POST "$WORKER_URL/digest"             -H "x-telegram-bot-api-secret-token: $TM_WEBHOOK_SECRET"             -H "content-type: text/plain; charset=utf-8"             --data-binary @out/summary.txt | tee /dev/stderr

      - name: Разослать уведомления
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.TM_WEBHOOK_SECRET != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-alerts.sql -y
          curl -sS -X POST "$WORKER_URL/notify"             -H "x-telegram-bot-api-secret-token: $TM_WEBHOOK_SECRET" | tee /dev/stderr

      - name: Коммит результата
        continue-on-error: true
        run: |
          git config user.name "tm-scout bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out/ competitions.json
          git diff --staged --quiet || git commit -m "быстрый мировой обход $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
