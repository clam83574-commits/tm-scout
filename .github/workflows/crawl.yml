# Еженедельный сбор игроков без агента.
#
# КУДА ПОЛОЖИТЬ: в новом репозитории tm-scout это файл
#   .github/workflows/crawl.yml
# (GitHub видит workflow только в корне репозитория, не в подпапке).
#
# Почему GitHub Actions: сборщику нужен настоящий Chromium (Transfermarkt
# закрыт AWS WAF) и ~48 минут на прогон. Лимит задачи здесь 6 часов,
# бесплатных минут 2000/мес, наш прогон съедает ~200.
name: crawl

on:
  schedule:
    - cron: "0 3 * * 1"        # понедельник, 03:00 UTC
  workflow_dispatch:            # и кнопкой вручную
    inputs:
      comps:
        description: "Лиги через запятую"
        default: "L1,L2,L3,BE1,BE2,BE3A,BE3V"
      clubs:
        description: "Лимит клубов на лигу (для дымового прогона)"
        default: ""
      players:
        description: "Лимит игроков на лигу (для дымового прогона)"
        default: ""

permissions:
  contents: write               # чтобы коммитить результат обратно
  # Заданный блок permissions обнуляет ВСЕ не перечисленные права.
  # Без этой строки gh run download получил бы 403, и запасной
  # источник базы не сработал бы ровно тогда, когда он нужен.
  actions: read                 # чтобы скачать артефакт world-sqlite

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Секреты подняты на уровень job СПЕЦИАЛЬНО: в `if:` шага контекст env
    # видит только переменные job, а не объявленные внутри самого шага.
    # Объявленный в шаге токен в его же условии всегда пуст -> шаг заливки
    # в базу бота молча не выполнялся бы никогда.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TM_WEBHOOK_SECRET: ${{ secrets.TM_WEBHOOK_SECRET }}
      WORKER_URL: https://tm-scout-bot.clam83574.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Забрать прошлую базу
        # База нужна, чтобы посчитать дифф: кто потерял агента с прошлой недели.
        # Без неё каждый прогон выглядел бы как «все игроки новые».
        uses: actions/cache@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-

      # Кэш GitHub - хранилище «по возможности», а не гарантия: его вытесняют
      # по объёму (10 ГБ на репозиторий) и чистят после 7 дней без обращения.
      # 21.09 он вернул пустышку, недельный прогон собрал Германию с Бельгией
      # и полной заменой стёр мир в боте. Артефакт мирового обхода живёт 30
      # дней и такие провалы переживает - берём его запасным вариантом.
      # Недельный прогон обходит 7 лиг из 496, поэтому стартовать с нуля ему
      # нельзя ВООБЩЕ: лучше упасть здесь, за минуту, чем через полтора часа
      # отдать боту огрызок.
      - name: Нет базы - взять её из артефакта мирового обхода
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=0
          if [ -f data/scout.sqlite ]; then
            have=$(python -c "import sqlite3;print(sqlite3.connect('data/scout.sqlite').execute('SELECT COUNT(*) FROM players').fetchone()[0])" 2>/dev/null || echo 0)
          fi
          echo "в восстановленной базе игроков: $have"
          if [ "${have:-0}" -lt 50000 ]; then
            echo "::warning::кэш не дал мировую базу ($have игроков), беру артефакт world-sqlite"
            mkdir -p data
            if gh run download -n world-sqlite -D data; then
              python -c "import sqlite3;print('из артефакта игроков:', sqlite3.connect('data/scout.sqlite').execute('SELECT COUNT(*) FROM players').fetchone()[0])"
            else
              echo "::error::Ни кэша, ни артефакта world-sqlite. Недельный прогон обходит только 7 лиг, и его выгрузка полной заменой сотрёт в боте весь остальной мир. Запусти world-fast, дождись артефакта и повтори."
              exit 1
            fi
          fi

      - name: Прогон
        env:
          COMPS: ${{ github.event.inputs.comps || 'L1,L2,L3,BE1,BE2,BE3A,BE3V' }}
          CLUBS: ${{ github.event.inputs.clubs }}
          PLAYERS: ${{ github.event.inputs.players }}
        run: |
          # if, а не `[ -n "$X" ] && ...`: GitHub гоняет bash с set -e, и при
          # пустом значении такая строка возвращает ненулевой код, роняя шаг.
          # По расписанию эти поля ВСЕГДА пусты, так что падало бы каждый раз.
          ARGS="--comps $COMPS"
          if [ -n "$CLUBS" ]; then ARGS="$ARGS --clubs $CLUBS"; fi
          if [ -n "$PLAYERS" ]; then ARGS="$ARGS --players $PLAYERS"; fi
          echo "запускаю: scout.py $ARGS"
          python scout.py $ARGS

      # Отдельным проходом, потому что это не лига: Transfermarkt держит их
      # псевдоклубом 515. Дёшево (~255 запросов) и меняется быстрее лиг,
      # поэтому собираем каждую неделю. Без этого шага заливка в D1 делает
      # DROP TABLE, и игроки без клуба тихо пропадают из бота.
      - name: Игроки без клуба
        run: python scout.py --free-agents --workers 10 --delay 0.5,1.0

      - name: Что изменилось за неделю
        run: python diff.py --since 8 --out out/weekly-diff.md

      # ПОРЯДОК ВАЖЕН. Сначала сохранить данные и доставить их боту, и только
      # потом коммитить в репозиторий. Раньше коммит стоял первым - и когда он
      # падал (конфликт rebase, незастейдженные файлы), все следующие шаги
      # пропускались: прогон собирал данные, а бот их не получал. Дважды.
      - name: Сложить базу в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: scout-sqlite
          path: data/scout.sqlite
          retention-days: 90

      # ПРЕДОХРАНИТЕЛЬ. Заливка ниже начинается с DROP TABLE: она верна
      # ровно тогда, когда собранная база содержит ВСЁ. Прогон, стартовавший
      # без базы прошлого раза, соберёт только свои лиги и полной заменой
      # сотрёт остальной мир - и останется зелёным. 21.09.2026 так пропали
      # 134 610 игроков, в боте осталось 691. Сравниваем с тем, что уже живёт
      # в боте, и при резкой усушке падаем красным, ничего не тронув.
      - name: Проверить, что база не усохла
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && !github.event.inputs.clubs && !github.event.inputs.players }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --json             --command "SELECT COUNT(*) players, COUNT(DISTINCT country) countries, COUNT(DISTINCT comp) comps FROM players"             > out/remote.json 2>&1 || true
          python guard.py --remote-json out/remote.json

      - name: Залить в базу бота (Cloudflare D1)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && !github.event.inputs.clubs && !github.event.inputs.players }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-import.sql -y
          # сводка счётчиков идёт СРАЗУ ЗА данными: иначе экраны
          # выбора показывали бы числа от прошлого прогона
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-stats.sql -y
          npx wrangler@4 d1 execute tm-scout --remote --json \
            --command "SELECT COUNT(*) n FROM players"


      # Уведомление «агент пропал»: главный сигнал продукта. Порог по
      # стоимости обязателен - без него сообщение утонет в игроках низших
      # лиг, где поле меняется от того, что его наконец кто-то заполнил.
      - name: Отобрать события «агент пропал»
        run: python alerts.py --since 8 --min-value 200000 --out out/d1-alerts.sql

      - name: Разослать уведомления
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.TM_WEBHOOK_SECRET != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-alerts.sql -y
          curl -sS -X POST "$WORKER_URL/notify"             -H "x-telegram-bot-api-secret-token: $TM_WEBHOOK_SECRET" | tee /dev/stderr

      - name: Коммит результата
        # Прогон с лимитами - дымовой: он собирает несколько игроков и не должен
        # затирать настоящую выгрузку в репозитории. Коммитим только полный сбор.
        # continue-on-error: это бухгалтерия, а не продукт. Данные уже у бота,
        # и неудачный коммит не должен красить прогон в красное.
        if: ${{ !github.event.inputs.clubs && !github.event.inputs.players }}
        continue-on-error: true
        run: |
          git config user.name "tm-scout bot"
          git config user.email "bot@users.noreply.github.com"
          # add -A по папке, а не поимённо: прогон трогает и d1-import.sql,
          # незастейдженный файл ронял rebase с «You have unstaged changes»
          git add -A out/
          git diff --staged --quiet || git commit -m "сбор $(date -u +%Y-%m-%d): обновление кандидатов"
          git pull --rebase --autostash origin main
          git push

      - name: Предупредить, если бот не обновляется
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Секрет CLOUDFLARE_API_TOKEN не задан - база собрана, но бот продолжит показывать прошлые данные. См. deploy/DEPLOY.md"
