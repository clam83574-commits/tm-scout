# Еженедельный сбор игроков без агента.
#
# КУДА ПОЛОЖИТЬ: в новом репозитории tm-scout это файл
#   .github/workflows/crawl.yml
# (GitHub видит workflow только в корне репозитория, не в подпапке).
#
# Почему GitHub Actions: сборщику нужен настоящий Chromium (Transfermarkt
# закрыт AWS WAF) и ~48 минут на прогон. Лимит задачи здесь 6 часов,
# бесплатных минут 2000/мес, наш прогон съедает ~200.
name: crawl

on:
  schedule:
    - cron: "0 3 * * 1"        # понедельник, 03:00 UTC
  workflow_dispatch:            # и кнопкой вручную
    inputs:
      comps:
        description: "Лиги через запятую"
        default: "L1,L2,L3,BE1,BE2,BE3A,BE3V"
      clubs:
        description: "Лимит клубов на лигу (для дымового прогона)"
        default: ""
      players:
        description: "Лимит игроков на лигу (для дымового прогона)"
        default: ""

permissions:
  contents: write               # чтобы коммитить результат обратно

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Забрать прошлую базу
        # База нужна, чтобы посчитать дифф: кто потерял агента с прошлой недели.
        # Без неё каждый прогон выглядел бы как «все игроки новые».
        uses: actions/cache@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-

      - name: Прогон
        env:
          COMPS: ${{ github.event.inputs.comps || 'L1,L2,L3,BE1,BE2,BE3A,BE3V' }}
          CLUBS: ${{ github.event.inputs.clubs }}
          PLAYERS: ${{ github.event.inputs.players }}
        run: |
          # if, а не `[ -n "$X" ] && ...`: GitHub гоняет bash с set -e, и при
          # пустом значении такая строка возвращает ненулевой код, роняя шаг.
          # По расписанию эти поля ВСЕГДА пусты, так что падало бы каждый раз.
          ARGS="--comps $COMPS"
          if [ -n "$CLUBS" ]; then ARGS="$ARGS --clubs $CLUBS"; fi
          if [ -n "$PLAYERS" ]; then ARGS="$ARGS --players $PLAYERS"; fi
          echo "запускаю: scout.py $ARGS"
          python scout.py $ARGS

      - name: Что изменилось за неделю
        run: python diff.py --since 8 --out out/weekly-diff.md

      - name: Коммит результата
        # Прогон с лимитами - дымовой: он собирает несколько игроков и не должен
        # затирать настоящую выгрузку в репозитории. Коммитим только полный сбор.
        if: ${{ !github.event.inputs.clubs && !github.event.inputs.players }}
        run: |
          git config user.name "tm-scout bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/candidates.csv out/candidates.json out/weekly-diff.md
          git diff --staged --quiet || git commit -m "сбор $(date -u +%Y-%m-%d): обновление кандидатов"
          git push

      - name: Сложить базу в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: scout-sqlite
          path: data/scout.sqlite
          retention-days: 90

      # Заливка в D1 включится, когда заведём Worker. Шаг молча пропускается,
      # пока в секретах репозитория нет токена Cloudflare.
      - name: Залить в Cloudflare D1
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tm-scout --remote --file=out/d1-import.sql
