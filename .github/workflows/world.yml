# Полный обход мира: 431 лига, ~181 000 игроков, ~187 000 запросов.
#
# КУДА ПОЛОЖИТЬ: .github/workflows/world.yml
#
# Почему четыре задачи, а не одна: лимит одной задачи GitHub - 6 часов, а
# полный обход при 10 потоках это ~5,3 часа. Впритык к лимиту гонять нельзя -
# любое замедление на стороне Transfermarkt, и прогон обрывается на середине,
# потеряв всё. Четыре части по ~1,3 часа дают четырёхкратный запас, и упавшую
# часть можно перезапустить одну, не трогая остальные.
#
# Части идут ПОСЛЕДОВАТЕЛЬНО и передают базу друг другу артефактом: так
# сохраняется история изменений (кто потерял агента с прошлой недели) и
# нагрузка на Transfermarkt не умножается на четыре.
name: world

# РАСПИСАНИЕ СНЯТО (2026-09-23): по нему теперь ходит world-fast раз в две
# недели. Этот файл остаётся щадящим ручным режимом - 10 потоков вместо 16 и
# части по очереди, на случай если Transfermarkt начнёт отвечать отказами.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Потоков (10 - проверенный режим, 50 - предел замера)"
        default: "10"
      delay:
        description: "Пауза между запросами, мин,макс сек"
        default: "0.5,1.0"
      max_tier:
        description: "До какого дивизиона (7 = все лиги, 3 = только профи)"
        default: "7"
      youth:
        description: "Брать молодёжные лиги (80 лиг, ~28 000 игроков)"
        default: "true"

permissions:
  contents: write

env:
  WORKERS: ${{ github.event.inputs.workers || '10' }}
  DELAY: ${{ github.event.inputs.delay || '0.5,1.0' }}
  MAX_TIER: ${{ github.event.inputs.max_tier || '7' }}
  YOUTH: ${{ github.event.inputs.youth || 'true' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TM_WEBHOOK_SECRET: ${{ secrets.TM_WEBHOOK_SECRET }}
  WORKER_URL: https://tm-scout-bot.clam83574.workers.dev

jobs:
  shard1:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      # ОДИН кэш на оба прогона, недельный и месячный. Раньше у каждого был
      # свой, но в базу бота оба заливают ПОЛНУЮ замену - и первый же
      # недельный прогон после месячного стирал бы весь мир, оставив две
      # страны. Общая база: недельный освежает приоритетные лиги, месячный
      # обходит всё, заливается всегда целиком.
      # ТОЛЬКО restore. Обычный actions/cache в конце задачи САМ сохраняет
      # кэш под своим ключом, а ключи в GitHub неизменяемы - поэтому shard1
      # занимал ключ прогона базой ДО обхода, и шаг сохранения в shard4 под
      # тем же ключом молча отказывал. Результат месячного обхода не попадал
      # в кэш ни разу; 21.09 недельный прогон восстановил старый огрызок и
      # стёр мир в боте.
      - name: Забрать базу прошлого прогона
        uses: actions/cache/restore@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-
      - name: Перепись лиг
        run: python discover.py --workers "$WORKERS" --delay "$DELAY"
      - name: Часть 1 из 4
        run: |
          YARG=""
          if [ "$YOUTH" = "true" ]; then YARG="--youth"; fi
          python scout.py --world --shard 1/4 --max-tier "$MAX_TIER" $YARG --workers "$WORKERS" --delay "$DELAY"
      - uses: actions/upload-artifact@v4
        with: { name: db-1, path: data/scout.sqlite, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: comps, path: competitions.json, retention-days: 14 }

  shard2:
    needs: shard1
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: db-1, path: data }
      - uses: actions/download-artifact@v4
        with: { name: comps, path: . }
      - name: Часть 2 из 4
        run: |
          YARG=""
          if [ "$YOUTH" = "true" ]; then YARG="--youth"; fi
          python scout.py --world --shard 2/4 --max-tier "$MAX_TIER" $YARG --workers "$WORKERS" --delay "$DELAY"
      - uses: actions/upload-artifact@v4
        with: { name: db-2, path: data/scout.sqlite, retention-days: 14 }

  shard3:
    needs: shard2
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: db-2, path: data }
      - uses: actions/download-artifact@v4
        with: { name: comps, path: . }
      - name: Часть 3 из 4
        run: |
          YARG=""
          if [ "$YOUTH" = "true" ]; then YARG="--youth"; fi
          python scout.py --world --shard 3/4 --max-tier "$MAX_TIER" $YARG --workers "$WORKERS" --delay "$DELAY"
      - uses: actions/upload-artifact@v4
        with: { name: db-3, path: data/scout.sqlite, retention-days: 14 }

  shard4:
    needs: shard3
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: db-3, path: data }
      - uses: actions/download-artifact@v4
        with: { name: comps, path: . }
      - name: Часть 4 из 4
        run: |
          YARG=""
          if [ "$YOUTH" = "true" ]; then YARG="--youth"; fi
          python scout.py --world --shard 4/4 --max-tier "$MAX_TIER" $YARG --workers "$WORKERS" --delay "$DELAY"

      # См. тот же шаг в crawl.yml: без него заливка в D1 делает DROP TABLE
      # и стирает игроков без клуба, которых мировой обход не собирает.
      - name: Игроки без клуба
        run: python scout.py --free-agents --workers "$WORKERS" --delay "$DELAY"

      - name: Что изменилось за месяц
        run: python diff.py --since 32 --out out/world-diff.md

      - name: Итоги
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/scout.sqlite")
          tot = c.execute("SELECT COUNT(*) FROM players").fetchone()[0]
          print("игроков в базе:", tot)
          for st, n in c.execute("SELECT agent_status, COUNT(*) FROM players GROUP BY 1 ORDER BY 2 DESC"):
              print("  %-10s %6d" % (st, n))
          print("стран:", c.execute("SELECT COUNT(DISTINCT country) FROM players").fetchone()[0])
          print("лиг:", c.execute("SELECT COUNT(DISTINCT comp) FROM players").fetchone()[0])
          PY

      # ПОРЯДОК ВАЖЕН: сохранить, доставить боту, и только потом коммит.
      # 11.09 этот прогон собрал все четыре части, упал на `git pull --rebase`
      # из-за конфликта - и пропустил всё, что стояло ниже: кэш, артефакт,
      # заливку в бота. Восемь часов работы ушли в никуда.
      - name: Сохранить базу на следующий раз
        uses: actions/cache/save@v4
        with:
          path: data
          key: scout-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with: { name: world-sqlite, path: data/scout.sqlite, retention-days: 30 }

      # ПРЕДОХРАНИТЕЛЬ. Заливка ниже начинается с DROP TABLE: она верна
      # ровно тогда, когда собранная база содержит ВСЁ. Прогон, стартовавший
      # без базы прошлого раза, соберёт только свои лиги и полной заменой
      # сотрёт остальной мир - и останется зелёным. 21.09.2026 так пропали
      # 134 610 игроков, в боте осталось 691. Сравниваем с тем, что уже живёт
      # в боте, и при резкой усушке падаем красным, ничего не тронув.
      - name: Проверить, что база не усохла
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --json             --command "SELECT COUNT(*) players, COUNT(DISTINCT country) countries, COUNT(DISTINCT comp) comps FROM players"             > out/remote.json 2>&1 || true
          python guard.py --remote-json out/remote.json

      - name: Залить в базу бота (Cloudflare D1)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-import.sql -y
          # сводка счётчиков идёт СРАЗУ ЗА данными: иначе экраны
          # выбора показывали бы числа от прошлого прогона
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-stats.sql -y
          npx wrangler@4 d1 execute tm-scout --remote --json \
            --command "SELECT COUNT(*) n FROM players"


      # Уведомление «агент пропал»: главный сигнал продукта. Порог по
      # стоимости обязателен - без него сообщение утонет в игроках низших
      # лиг, где поле меняется от того, что его наконец кто-то заполнил.
      - name: Отобрать события «агент пропал»
        run: python alerts.py --since 32 --min-value 200000 --out out/d1-alerts.sql

      # Сводка идёт ПЕРЕД подробным списком: сначала человек видит, что
      # прогон состоялся и сколько всего изменилось, потом - кого именно
      # звонить. Обратный порядок читается как «пришёл список непонятно из
      # чего». Шлём даже когда изменений нет: молчание неотличимо от
      # сломавшегося прогона, а строка «изменений нет» отличима.
      - name: Краткая сводка в бот
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.TM_WEBHOOK_SECRET != '' }}
        run: |
          python summary.py --since 32 --alerts-min 200000 --out out/summary.txt
          curl -sS -X POST "$WORKER_URL/digest"             -H "x-telegram-bot-api-secret-token: $TM_WEBHOOK_SECRET"             -H "content-type: text/plain; charset=utf-8"             --data-binary @out/summary.txt | tee /dev/stderr

      - name: Разослать уведомления
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.TM_WEBHOOK_SECRET != '' }}
        run: |
          npx wrangler@4 d1 execute tm-scout --remote --file=out/d1-alerts.sql -y
          curl -sS -X POST "$WORKER_URL/notify"             -H "x-telegram-bot-api-secret-token: $TM_WEBHOOK_SECRET" | tee /dev/stderr

      - name: Коммит результата
        continue-on-error: true      # бухгалтерия, данные уже у бота
        run: |
          git config user.name "tm-scout bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out/ competitions.json
          git diff --staged --quiet || git commit -m "мировой обход $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      - name: Предупредить, если бот не обновляется
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Нет CLOUDFLARE_API_TOKEN - бот показывает прошлые данные"
